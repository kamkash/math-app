[workspace]
resolver = "2"
members = [
    "src-tauri",
    "axum-backend",
    "math-core",
    "math-parser",
    "interpreter",
    "giac-rs",
    "symengine-rs",
    "calculus",
    "linear-algebra",
    "statistics",
    "algebra",
    "symbolic-engine",
    "llama-cpp-rs",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["kamkash <mrkamkash@gmail.com>"]

[workspace.dependencies]
log = "0.4.27"
test-log = "0.2.17"
antlr-rust = "0.3.0-beta"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
giac-rs = { path = "giac-rs" }
symengine-rs = { path = "symengine-rs" }
math-core = { path = "math-core" }
calculus = { path = "calculus" }
linear-algebra = { path = "linear-algebra" }
statistics = { path = "statistics" }
algebra = { path = "algebra" }
symbolic-engine = { path = "symbolic-engine" }
llama-cpp-rs = { path = "llama-cpp-rs" }