<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
</head>

<body>
  <main class="container">
    <form class="row" id="input-form">
      <h3>symmath.app</h3>
      <h3>Yet Another Semi Intelligent Symbolic Math App</h3>
      <div class="toolbar">
        <button id="reset_model">Reset Model</button>
        <button id="reset_context">Reset context</button>
        <button id="add_grammar">Add grammar</button>
        <button id="greet">Greet</button>
        <button id="solver">Solver</button>
        <button type="submit">
          <img src="/src/assets/go.svg" alt="Go" />
          LLM
        </button>
      </div>
      <math-field id="prompt-input" placeholder="\text{What's up}" smart-mode="on" ></math-field>
      <math-field id="response-output" smart-mode="on"></math-field>
    </form>
  </main>
</body>

</html>
