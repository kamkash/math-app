<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="/src/styles.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tauri App</title>
  <script type="module" src="/src/assets/tex-mml-chtml.js" defer></script>
  <script type="module" src="/src/main.ts" defer></script>

</head>

<body>
  <main class="container">
    <div class="kktoolbar">
      <button id="reset_model">Reset Model</button>
      <button id="reset_context">Reset context</button>
      <button id="add_grammar">Add grammar</button>
      <button id="greet">greet</button>
    </div>
    <form class="row" id="greet-form">
      <textarea id="prompt-input" placeholder="What's up..." rows="7"></textarea>
      <button type="submit">
        <img src="/src/assets/go.svg" alt="Go" />
        Go
      </button>
      <p id="content-text"></p>
      <p id="raw-content-text"></p>
    </form>
    <textarea id="latex-input" style="display: none;height: 200px;"></textarea>
    <div id="math-output" style="display: none;"></div>
    <script>
      const input = document.getElementById('latex-input');
      const output = document.getElementById('math-output');
      input.addEventListener('input', () => {
        output.innerHTML = '\\[' + input.value + '\\]';
        MathJax.typeset([output]);
      });    
    </script>
  </main>
</body>

</html>
