<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="/src/styles.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tauri App</title>
  <script type="module" src="/src/assets/tex-mml-chtml.js" defer></script>
  <script type="module" src="/src/main.ts" defer></script>

</head>

<body>
  <main class="container">
    <div class="kktoolbar">
      <button id="init_model">Init Model</button>
      <button id="new_chat">New Thread</button>
      <button id="greet">greet</button>
    </div>
    <form class="row" id="greet-form">
      <input id="prompt-input" placeholder="What's up..." />
      <button type="submit">
        <img src="/src/assets/go.svg" alt="Go" />
        Go
      </button>
    </form>
    <p id="content-text"></p>
    <textarea id="latex-input" style="display: none;height: 200px;"></textarea>
    <div id="math-output" style="display: none;"></div>
    <script>
      const input = document.getElementById('latex-input');
      const output = document.getElementById('math-output');

      input.addEventListener('input', () => {
        output.innerHTML = '\\[' + input.value + '\\]';
        MathJax.typeset([output]);
      });    
    </script> 
  </main>
</body>

</html>
