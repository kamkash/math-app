<style>
    :host {
        font-family: 'Inter', Arial, sans-serif;
        display: block;
        width: 100%;
        /* Make the shadow root fill the host element's width */
        height: 100%;
        /* Make the shadow root fill the host element's height */
        box-sizing: border-box;
        /* Include padding and border in the element's total width and height */
        background: #f9fbfd;
        border-radius: 16px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        padding: 32px 24px 24px 24px;
    }

    .toolbar {
        display: flex;
        flex-direction: row;
        justify-content: center;
        text-align: center;
    }

    .toolbar button {
        margin: 0 5px;
        padding: 0.5em 1em;
        background-color: #f6f6f6;
        border: 1px solid #ccc;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.3s, transform 0.2s;
    }

    button img {
        vertical-align: middle;
        /* Ensures the image aligns properly */
    }

    form button {
        margin: 0px;
        font-size: 0.8em;
    }

    math-field {
        font-family: "STIX Two Math", "Latin Modern Math", "Cambria Math",
            "Noto Sans Math", "XITS Math", "Asana Math", serif;
        /* font-size: 1.1em; */
        padding: 10px;
        margin: 10px;
        width: 90%;
        min-height: 150px;
        overflow: auto;
        /* Enable scrolling */
        box-shadow: inset 0 0 3px rgba(0, 0, 0, 0.7);
        border-radius: 8px;
        /* Add rounded corners */
        display: flex;
    }

    button {
        width: auto;
        /* Let the button size itself */
        margin-top: 1em;
        color: #0f0f0f;
        background-color: #f6f6f6f0;
        border-radius: 8px;
        border: 1px solid transparent;
        padding: 0.6em 1.2em;
        font-size: 0.9em;
        transition: border-color 0.25s;
        box-shadow: 0 2px 2px rgba(0, 0, 0, 0.2);
        outline: none;
        padding: 0.5em 1em;
    }
</style>

<div class="toolbar">
    <button id="reset_model">Reset Model</button>
    <button id="reset_context">Reset context</button>
    <button id="add_grammar">Add grammar</button>
    <button id="greet">Greet</button>
    <button id="solver">Solver</button>
    <button id="llm-solver">
        <img src="/src/assets/go.svg" alt="Go" />
        LLM
    </button>
</div>
<math-field id="prompt-input" placeholder="\text{What's up}" smart-mode="on"></math-field>
<math-field id="response-output" smart-mode="on"></math-field>
