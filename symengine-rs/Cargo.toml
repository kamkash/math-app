[package]
name = "symengine-rs"
version.workspace = true
edition.workspace = true
authors.workspace = true

[build-dependencies]
bindgen = "0.71.1"

[dependencies]
itertools = "0.14.0"
log = { workspace = true }
test-log = { workspace = true }
lazy_static = { version = "1.5.0", features = [] }
regex = "1.11.1"

[lib]
crate-type = ["rlib"]  # or ["cdylib"] for Rust-specific linkage
